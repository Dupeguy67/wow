<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Bypass - 1080p 60fps / 120fps</title>
    <style>
        body { background: #0a0a0a; color: #00ffcc; font-family: monospace; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        button, input, select { background: #1a1a1a; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px 20px; margin: 10px 5px; font-family: monospace; font-size: 14px; cursor: pointer; }
        button:hover { background: #00ffcc22; }
        .option-group { border: 1px solid #00ffcc; padding: 20px; margin: 20px 0; border-radius: 8px; }
        pre { background: #000000aa; padding: 15px; overflow-x: auto; max-height: 400px; border: 1px solid #00ffcc33; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; }
        h2 { margin-top: 0; }
        input[type="radio"] { margin-left: 20px; }
        .footer { font-size: 11px; text-align: center; margin-top: 30px; color: #00ffcc88; }
    </style>
</head>
<body>
<div class="container">
    <h2>TikTok Bypass Tool - 1080p Preservation</h2>
    <div class="option-group">
        <label><strong>Quality Preset:</strong></label><br><br>
        <input type="radio" name="preset" value="1080p_60fps" id="opt60" checked>
        <label for="opt60">1080p / 60 fps / 25 Mbps</label><br>
        <input type="radio" name="preset" value="1080p_120fps" id="opt120">
        <label for="opt120">1080p / 120 fps / 35 Mbps</label><br>
    </div>
    <input type="file" id="fileInput" accept="video/mp4">
    <button id="processBtn">Process & Download (Bypass Ready)</button>
    <pre id="log">Waiting for input...</pre>
    <div class="footer">Processes entirely in your browser. No upload to any server. 1080p 60/120fps preserved.</div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/umd/ffmpeg.js"></script>
<script>
    (function() {
        const logElement = document.getElementById('log');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        let ffmpegInstance = null;
        let isLoading = false;

        function log(message) {
            logElement.innerText = message;
            console.log(message);
        }

        async function initFFmpeg() {
            if (ffmpegInstance) return ffmpegInstance;
            if (isLoading) {
                log('FFmpeg already loading, waiting...');
                while (isLoading) await new Promise(r => setTimeout(r, 100));
                return ffmpegInstance;
            }
            isLoading = true;
            log('Loading FFmpeg (25MB)... 30-60 seconds');
            try {
                if (typeof window.FFmpeg === 'undefined') {
                    throw new Error('FFmpeg library not loaded. Retrying...');
                }
                const { FFmpeg } = window;
                ffmpegInstance = new FFmpeg();
                await ffmpegInstance.load({
                    coreURL: 'https://unpkg.com/@ffmpeg/core@0.11.6/dist/umd/ffmpeg-core.js',
                    wasmURL: 'https://unpkg.com/@ffmpeg/core@0.11.6/dist/umd/ffmpeg-core.wasm'
                });
                log('FFmpeg ready. Select video and click Process.');
                isLoading = false;
                return ffmpegInstance;
            } catch (err) {
                log('FFmpeg error: ' + err.message + ' - Try refreshing the page.');
                isLoading = false;
                throw err;
            }
        }

        async function processVideo() {
            try {
                if (!fileInput.files || fileInput.files.length === 0) {
                    log('No file selected. Choose an MP4 video.');
                    return;
                }
                const file = fileInput.files[0];
                const is120 = document.getElementById('opt120').checked;
                const fps = is120 ? 120 : 60;
                const bitrate = is120 ? '35000k' : '25000k';
                const gop = fps * 2;
                
                log(`Processing: 1080p ${fps}fps ${bitrate}...`);
                const ffmpeg = await initFFmpeg();
                if (!ffmpeg) return;
                
                log('Reading file...');
                const fileData = new Uint8Array(await file.arrayBuffer());
                log(`File size: ${(fileData.length / 1024 / 1024).toFixed(2)} MB`);
                await ffmpeg.writeFile('input.mp4', fileData);
                log('Encoding (1-5 minutes)...');
                
                await ffmpeg.exec([
                    '-i', 'input.mp4',
                    '-c:v', 'libx264',
                    '-profile:v', 'high',
                    '-level', '4.2',
                    '-b:v', bitrate,
                    '-r', fps.toString(),
                    '-g', gop.toString(),
                    '-bf', '2',
                    '-refs', '3',
                    '-pix_fmt', 'yuv422p',
                    '-x264-params', 'nal-hrd=cbr:force-cfr=1',
                    '-movflags', '+faststart',
                    'output.mp4'
                ]);
                
                log('Reading encoded file...');
                const encodedData = await ffmpeg.readFile('output.mp4');
                const buffer = new Uint8Array(encodedData);
                
                log('Adding 56-byte padding before moov atom...');
                let moovPos = -1;
                for (let i = 0; i < buffer.length - 4; i++) {
                    if (buffer[i] === 0x6D && buffer[i+1] === 0x6F && buffer[i+2] === 0x6F && buffer[i+3] === 0x76) {
                        moovPos = i;
                        break;
                    }
                }
                
                let finalBuffer;
                if (moovPos !== -1) {
                    const padding = new Uint8Array(56);
                    const beforeMoov = buffer.slice(0, moovPos);
                    const fromMoov = buffer.slice(moovPos);
                    finalBuffer = new Uint8Array(beforeMoov.length + 56 + fromMoov.length);
                    finalBuffer.set(beforeMoov, 0);
                    finalBuffer.set(padding, beforeMoov.length);
                    finalBuffer.set(fromMoov, beforeMoov.length + 56);
                    log('Padding applied.');
                } else {
                    log('Warning: moov not found, using original file.');
                    finalBuffer = buffer;
                }
                
                const blob = new Blob([finalBuffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const downloadLink = document.createElement('a');
                downloadLink.href = url;
                downloadLink.download = `tiktok_bypass_1080p_${fps}fps.mp4`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(url);
                
                log(`SUCCESS! File saved as tiktok_bypass_1080p_${fps}fps.mp4`);
                
                await ffmpeg.deleteFile('input.mp4');
                await ffmpeg.deleteFile('output.mp4');
                
            } catch (err) {
                log('ERROR: ' + err.message);
                console.error(err);
            }
        }
        
        processBtn.onclick = processVideo;
        log('Ready. Select MP4, choose preset, click Process.');
        
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (!ffmpegInstance && !isLoading) {
                    log('Pre-loading FFmpeg in background...');
                    initFFmpeg().catch(e => log('Pre-load failed: ' + e.message));
                }
            }, 500);
        });
    })();
</script>
</body>
</html>
